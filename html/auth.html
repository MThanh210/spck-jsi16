<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập / Đăng ký - CineWave</title>

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
    <!-- Header đơn giản, không có nav-links/search vì đang ở trang auth -->
    <header class="navbar">
        <a href="../html/home.html" class="logo"><i class="fa-solid fa-film"></i> CINE<span>WAVE</span></a>
        <a href="../html/home.html" class="nav-btn"><i class="fa-solid fa-arrow-left"></i> Về trang chủ</a>
    </header>

    <!-- Trang Đăng nhập / Đăng ký -->
    <main class="auth-page">
        <div class="auth-page-card">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Đăng nhập</button>
                <button class="auth-tab" data-tab="register">Đăng ký</button>
            </div>

            <form id="login-form" class="auth-form">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required placeholder="you@example.com" autocomplete="email" />
                <label for="login-password">Mật khẩu</label>
                <input type="password" id="login-password" required placeholder="••••••••"
                    autocomplete="current-password" />
                <p class="auth-error" id="login-error"></p>
                <button type="submit" class="btn-primary auth-submit"><i class="fa-solid fa-right-to-bracket"></i>
                    Đăng nhập</button>
                <p class="auth-switch-text">Chưa có tài khoản? <span class="auth-switch-link" data-tab="register">Đăng
                        ký ngay</span></p>
            </form>

            <form id="register-form" class="auth-form" style="display:none;">
                <label for="register-name">Họ tên</label>
                <input type="text" id="register-name" required placeholder="Nguyễn Văn A" autocomplete="name" />
                <label for="register-email">Email</label>
                <input type="email" id="register-email" required placeholder="you@example.com" autocomplete="email" />
                <label for="register-password">Mật khẩu</label>
                <input type="password" id="register-password" required placeholder="Tối thiểu 6 ký tự"
                    autocomplete="new-password" />
                <p class="auth-error" id="register-error"></p>
                <button type="submit" class="btn-primary auth-submit"><i class="fa-solid fa-user-plus"></i> Tạo tài
                    khoản</button>
                <p class="auth-switch-text">Đã có tài khoản? <span class="auth-switch-link" data-tab="login">Đăng
                        nhập</span></p>
            </form>
        </div>
    </main>

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-compat.js"></script>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
</body>

</html>
